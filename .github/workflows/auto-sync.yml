name: Auto Sync

on:
  # 定时同步：每 1 小时一次（可自行调整）
  schedule:
    - cron: "15 */1 * * *"

  # 手动触发
  workflow_dispatch:
    inputs:
      force:
        description: "强制更新（忽略缓存状态，重新拉取/重算）"
        type: boolean
        default: false
      only:
        description: "只处理指定的 source / package 名（留空 = 全部）"
        type: string
        default: ""
      mode:
        description: "变更处理方式"
        type: choice
        default: commit
        options:
          - commit
          - pr

  # 修改配置 / 脚本后立即跑一次
  push:
    branches: [main, master]
    paths:
      - "config/**"
      - "update.sh"
      - "lib/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl coreutils tar

      - name: Run sync
        env:
          # GitHub API Token，避免 60 次/小时的匿名限额
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Telegram（可选）
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # WxPusher（可选）
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          WXPUSHER_TOPIC_IDS: ${{ secrets.WXPUSHER_TOPIC_IDS }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${{ inputs.force }}" = "true" ]; then ARGS+=(--force); fi
          if [ -n "${{ inputs.only }}" ]; then ARGS+=(--only "${{ inputs.only }}"); fi
          bash ./update.sh "${ARGS[@]}"

      - name: Detect changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "存在变更："
            git status --porcelain | head -50
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "没有变更"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true' && (inputs.mode == '' || inputs.mode == 'commit')
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(sync): sync upstream sources & package hashes [skip ci]"
          git push

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true' && inputs.mode == 'pr'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(sync): sync upstream sources & package hashes"
          branch: auto-sync/upstream
          delete-branch: true
          title: "chore(sync): 同步上游源码与依赖校验值"
          body: |
            由 GitHub Actions 自动同步：

            - **上游源码**：`luci-app-passwall` / `luci-app-passwall2` / `openwrt-passwall-packages`
            - **依赖版本**：`PKG_VERSION` / `PKG_HASH`（含多架构预编译资源逐个校验）

            包目录均在仓库根目录，可直接当 OpenWrt feed 拉取。
