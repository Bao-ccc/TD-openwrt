# =============================================================================
# OpenWrt 插件/包编译工作流
# 默认：x86/64 + 最新 snapshot SDK
# 编译产物自动发布到当前仓库 GitHub Releases
# =============================================================================

name: Build Packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "目标平台"
        type: choice
        default: x86/64
        options:
          - x86/64
          - x86/generic
          - armsr/armv8
          - armsr/armv7
          - rockchip/armv8
          - bcm27xx/bcm2711
          - bcm27xx/bcm2710
          - mediatek/filogic
          - ramips/mt7621
          - ramips/mt76x8
          - ath79/generic
          - ipq807x/generic
          - sunxi/cortexa8

      openwrt_version:
        description: "OpenWrt 版本，例如 snapshot、24.10.5、25.12.6"
        type: string
        default: "snapshot"

      preset:
        description: "要编译哪些插件"
        type: choice
        default: all
        options:
          - all
          - luci-app
          - proxy-core
          - passwall
          - nikki
          - theme
          - custom

      packages:
        description: "preset=custom 时使用，包名用空格或逗号分隔"
        type: string
        default: ""

      exclude_packages:
        description: "排除不编译的插件，空格或逗号分隔"
        type: string
        default: "luci-app-axonhub axonhub"

      release_tag:
        description: "GitHub Release 标签，留空则自动生成"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PLATFORM: ${{ inputs.platform }}
      OWT_VER: ${{ inputs.openwrt_version }}
      PRESET: ${{ inputs.preset }}
      CUSTOM_PKGS: ${{ inputs.packages }}
      EXCLUDE_PKGS: ${{ inputs.exclude_packages }}
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      # ----------------------------------------------------------------------
      # 1. 检出仓库
      # ----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # 2. 安装编译依赖
      # ----------------------------------------------------------------------
      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 rsync unzip \
            zlib1g-dev file wget zstd curl jq gh dos2unix

      # ----------------------------------------------------------------------
      # 3. 解析目标平台并获取 SDK 地址
      # ----------------------------------------------------------------------
      - name: Resolve SDK
        run: |
          set -euo pipefail

          TARGET="${PLATFORM%%/*}"
          SUBTARGET="${PLATFORM##*/}"

          if [ "$OWT_VER" = "snapshot" ]; then
            BASE="https://downloads.openwrt.org/snapshots/targets/${TARGET}/${SUBTARGET}"
          else
            BASE="https://downloads.openwrt.org/releases/${OWT_VER}/targets/${TARGET}/${SUBTARGET}"
          fi

          echo "目标目录: $BASE"

          PAGE=$(curl -fsSL --retry 3 "$BASE/")

          SDK_FILE=$(printf '%s\n' "$PAGE" \
            | grep -oE 'openwrt-sdk-[^"< ]+\.Linux-x86_64\.tar\.(zst|xz)' \
            | sort -u \
            | head -n 1 || true)

          if [ -z "$SDK_FILE" ]; then
            echo "::error::未找到 SDK，请检查平台或 OpenWrt 版本"
            exit 1
          fi

          echo "SDK 文件: $SDK_FILE"

          {
            echo "SDK_URL=${BASE}/${SDK_FILE}"
            echo "SDK_FILE=${SDK_FILE}"
            echo "TARGET=${TARGET}"
            echo "SUBTARGET=${SUBTARGET}"
            echo "TAG=${OWT_VER}-${TARGET}-${SUBTARGET}"
          } > sdk.env

          cat sdk.env

      # ----------------------------------------------------------------------
      # 4. 下载并解压 SDK
      # ----------------------------------------------------------------------
      - name: Download & extract SDK
        run: |
          set -euo pipefail

          . ./sdk.env

          echo "下载 SDK: $SDK_URL"

          curl -fsSL \
            --retry 3 \
            --connect-timeout 30 \
            -o sdk-archive \
            "$SDK_URL"

          ls -lh sdk-archive

          mkdir -p sdk

          case "$SDK_FILE" in
            *.tar.zst)
              tar --zstd -xf sdk-archive -C sdk --strip-components=1
              ;;
            *.tar.xz)
              tar -xJf sdk-archive -C sdk --strip-components=1
              ;;
            *)
              echo "::error::未知 SDK 格式: $SDK_FILE"
              exit 1
              ;;
          esac

          echo "SDK 根目录:"
          ls sdk | head -20

      # ----------------------------------------------------------------------
      # 5. 更新 feeds，并替换为当前仓库最新 sing-box
      # ----------------------------------------------------------------------
      - name: Update feeds and refresh sing-box
        run: |
          set -euo pipefail

          cd sdk

          echo "更新 feeds"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "检查仓库 sing-box"

          if [ ! -d ../sing-box ] || [ ! -f ../sing-box/Makefile ]; then
            echo "::error::仓库根目录下没有 sing-box/Makefile，无法替换"
            exit 1
          fi

          # 删除 SDK 中的旧 feed 版本
          rm -rf feeds/packages/net/sing-box

          mkdir -p feeds/packages/net

          # 使用当前仓库中的 sing-box
          cp -a ../sing-box feeds/packages/net/sing-box

          echo "sing-box Makefile:"
          sed -n '1,100p' feeds/packages/net/sing-box/Makefile

          echo "sing-box 替换完成"

      # ----------------------------------------------------------------------
      # 6. 根据 preset 解析包列表
      # ----------------------------------------------------------------------
      - name: Resolve package list
        run: |
          set -euo pipefail

          ALL=$(find . \
            -maxdepth 2 \
            -name Makefile \
            -not -path './sdk/*' \
            -not -path './.git/*' \
            | sed 's|^\./||; s|/Makefile$||' \
            | sort -u \
            | tr '\n' ' ')

          echo "仓库内全部包:"
          echo "$ALL"

          case "$PRESET" in
            all)
              LIST="$ALL"
              ;;

            luci-app)
              LIST=$(printf '%s\n' "$ALL" \
                | tr ' ' '\n' \
                | grep -E '^luci-app-' \
                | tr '\n' ' ' || true)
              ;;

            proxy-core)
              LIST="xray-core xray-plugin v2ray-plugin sing-box hysteria shadowsocks-rust \
                    shadow-tls naiveproxy chinadns-ng geoview microsocks tcping simple-obfs \
                    mihomo-meta"
              ;;

            passwall)
              LIST="luci-app-passwall xray-core xray-plugin v2ray-plugin sing-box hysteria \
                    shadowsocks-rust shadow-tls shadowsocksr-libev naiveproxy chinadns-ng \
                    dns2socks geoview microsocks tcping simple-obfs ipt2socks v2ray-geodata \
                    smartdns"
              ;;

            nikki)
              LIST="luci-app-nikki nikki mihomo-meta"
              ;;

            theme)
              LIST=$(printf '%s\n' "$ALL" \
                | tr ' ' '\n' \
                | grep -E '^luci-theme-' \
                | tr '\n' ' ' || true)
              ;;

            custom)
              LIST=$(printf '%s' "$CUSTOM_PKGS" | tr ',' ' ')
              ;;

            *)
              echo "::error::未知 preset: $PRESET"
              exit 1
              ;;
          esac

          # 去重、检查包是否存在
          RES=""

          for p in $LIST; do
            [ -z "$p" ] && continue

            # sing-box 使用刚刚替换的 feed 包
            if [ "$p" = "sing-box" ] \
              && [ -f sdk/feeds/packages/net/sing-box/Makefile ]; then
              :
            elif [ ! -d "$p" ] || [ ! -f "$p/Makefile" ]; then
              echo "::warning::跳过不存在的包: $p"
              continue
            fi

            case " $RES " in
              *" $p "*)
                continue
                ;;
            esac

            RES="${RES} ${p}"
          done

          # 排除用户指定的插件
          EXCLUDE_NORMALIZED=$(printf '%s' "$EXCLUDE_PKGS" | tr ',' ' ')
          FINAL=""

          for p in $RES; do
            SKIP=false

            for excluded in $EXCLUDE_NORMALIZED; do
              if [ "$p" = "$excluded" ]; then
                echo "排除插件: $p"
                SKIP=true
                break
              fi
            done

            if [ "$SKIP" = false ]; then
              FINAL="${FINAL} ${p}"
            fi
          done

          FINAL=$(echo "$FINAL" | xargs)

          if [ -z "$FINAL" ]; then
            echo "::error::最终编译包列表为空"
            exit 1
          fi

          echo "最终编译列表:"
          echo "$FINAL"

          printf '%s\n' $FINAL > pkglist.txt

          cat pkglist.txt

      # ----------------------------------------------------------------------
      # 7. 注入本地插件到 SDK
      #    sing-box 保留在 feeds/packages/net/sing-box
      # ----------------------------------------------------------------------
      - name: Inject packages into SDK
        run: |
          set -euo pipefail

          cd sdk

          while IFS= read -r p; do
            [ -z "$p" ] && continue

            if [ "$p" = "sing-box" ]; then
              echo "sing-box 使用仓库最新版本，不再注入旧目录"
              continue
            fi

            if [ ! -d "../$p" ] || [ ! -f "../$p/Makefile" ]; then
              echo "::warning::本地包不存在，跳过注入: $p"
              continue
            fi

            find package/feeds \
              -type d \
              -name "$p" \
              -prune \
              -exec rm -rf {} + 2>/dev/null || true

            rm -rf "package/$p"

            cp -a "../$p" "package/$p"

            echo "已注入 package/$p"

          done < ../pkglist.txt

      # ----------------------------------------------------------------------
      # 7.5 修复补丁文件行尾
      # ----------------------------------------------------------------------
      - name: Fix line endings
        run: |
          set -euo pipefail

          find . \
            -path './sdk' -prune -o \
            -path './.git' -prune -o \
            -name '*.patch' \
            -type f \
            -print0 \
            | xargs -0 -r dos2unix -q

          if [ -d axonhub ]; then
            find axonhub \
              -type f \
              \( -name '*.patch' \
                 -o -name '*.tsx' \
                 -o -name '*.ts' \
                 -o -name '*.go' \
                 -o -name '*.yml' \
                 -o -name '*.yaml' \) \
              -exec dos2unix -q {} +
          fi

          echo "行尾修复完成"

      # ----------------------------------------------------------------------
      # 8. 逐包编译
      # ----------------------------------------------------------------------
      - name: Build
        run: |
          set -euo pipefail

          cd sdk

          make defconfig

          mkdir -p ../build-logs

          : > ../build-result.txt

          while IFS= read -r p; do
            [ -z "$p" ] && continue

            echo "=============================================================="
            echo "开始编译: $p"
            echo "=============================================================="

            if [ "$p" = "sing-box" ]; then
              BUILD_TARGET="package/feeds/packages/sing-box/compile"
            else
              BUILD_TARGET="package/$p/compile"
            fi

            if make "$BUILD_TARGET" \
                -j"$(nproc)" \
                V=s \
                > "../build-logs/$p.log" 2>&1; then

              echo "编译成功: $p"
              echo "ok   $p" >> ../build-result.txt

            else
              echo "编译失败: $p"
              tail -60 "../build-logs/$p.log" || true
              echo "fail $p" >> ../build-result.txt
            fi

          done < ../pkglist.txt

          echo "编译结果汇总:"
          cat ../build-result.txt

          if grep -q '^fail ' ../build-result.txt; then
            echo "::error::存在编译失败的包，请查看 build-logs"
            exit 1
          fi

      # ----------------------------------------------------------------------
      # 9. 收集本次选中的插件产物
      # ----------------------------------------------------------------------
      - name: Collect artifacts
        if: always()
        run: |
          set -euo pipefail

          . ./sdk.env

          OUT="artifacts/${TAG}"

          mkdir -p "$OUT"

          if [ ! -f pkglist.txt ]; then
            echo "::warning::pkglist.txt 不存在"
            exit 0
          fi

          while IFS= read -r p; do
            [ -z "$p" ] && continue

            echo "收集插件: $p"

            find sdk/bin \
              -type f \
              \( -name "${p}_*.ipk" \
                 -o -name "${p}-*.ipk" \
                 -o -name "${p}_*.apk" \
                 -o -name "${p}-*.apk" \) \
              ! -name '*-dbg.*' \
              ! -name '*-dev.*' \
              ! -name '*-src.*' \
              -exec cp -f {} "$OUT/" \; 2>/dev/null || true

          done < pkglist.txt

          echo "本次收集的插件产物:"
          find "$OUT" -maxdepth 1 -type f -printf '%f\n' | sort

          COUNT=$(find "$OUT" -maxdepth 1 -type f | wc -l)

          echo "共收集 $COUNT 个包"

          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::没有收集到插件包"
          fi

      # ----------------------------------------------------------------------
      # 10. 写入 Job Summary
      # ----------------------------------------------------------------------
      - name: Summary
        if: always()
        run: |
          set -u

          . ./sdk.env 2>/dev/null || true

          {
            echo "## OpenWrt 插件编译结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 平台 | ${PLATFORM:-unknown} |"
            echo "| OpenWrt | ${OWT_VER:-unknown} |"
            echo "| preset | ${PRESET:-unknown} |"
            echo ""
            echo "### 编译包列表"
            echo '```text'
            cat pkglist.txt 2>/dev/null || echo "(无)"
            echo '```'
            echo ""
            echo "### 编译结果"
            echo '```text'
            cat build-result.txt 2>/dev/null || echo "(无)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ----------------------------------------------------------------------
      # 11. 自动发布到当前仓库 GitHub Releases
      # ----------------------------------------------------------------------
      - name: Publish packages to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          . ./sdk.env

          TAG="$RELEASE_TAG"

          if [ -z "$TAG" ]; then
            TAG="${OWT_VER}-${TARGET}-${SUBTARGET}"
          fi

          TAG=$(printf '%s' "$TAG" | tr ' ' '-')

          REPO="${GITHUB_REPOSITORY}"
          OUT="artifacts/${TAG}"

          echo "目标仓库: $REPO"
          echo "Release 标签: $TAG"

          if [ ! -d "$OUT" ]; then
            echo "::error::产物目录不存在: $OUT"
            exit 1
          fi

          shopt -s nullglob

          FILES=("$OUT"/*.ipk "$OUT"/*.apk)

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::没有可发布的插件包"
            exit 1
          fi

          echo "准备发布的插件包:"
          printf '%s\n' "${FILES[@]}"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release 已存在，准备更新附件"
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "OpenWrt 插件包 ${TAG}" \
              --notes "OpenWrt 插件自动编译发布。

          平台：${PLATFORM}
          OpenWrt 版本：${OWT_VER}
          编译方案：${PRESET}

          本次发布包含所选插件的编译产物。"
          fi

          gh release upload "$TAG" \
            "${FILES[@]}" \
            --repo "$REPO" \
            --clobber

          echo "发布成功:"
          echo "https://github.com/${REPO}/releases/tag/${TAG}"

      # ----------------------------------------------------------------------
      # 12. 上传编译日志到 Actions Artifacts
      # ----------------------------------------------------------------------
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.platform }}-${{ inputs.openwrt_version }}
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 7
