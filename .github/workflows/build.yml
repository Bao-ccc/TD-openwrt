name: Build Packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "目标平台（默认 X86_64）"
        type: choice
        default: x86/64
        options:
          - x86/64
          - x86/generic
          - armsr/armv8
          - armsr/armv7
          - rockchip/armv8
          - bcm27xx/bcm2711
          - bcm27xx/bcm2710
          - mediatek/filogic
          - ramips/mt7621
          - ramips/mt76x8
          - ath79/generic
          - qualcommax/ipq807x
          - qualcommax/ipq60xx
          - sunxi/cortexa8

      openwrt_version:
        description: "OpenWrt 版本（snapshot / 25.12.6 / 24.10.5）"
        type: string
        default: "snapshot"

      plugin:
        description: "下拉选择要编译的插件（选 all 则按 preset 批量）"
        type: choice
        default: all
        options:
          - all
          - axonhub
          - chinadns-ng
          - dns2socks
          - gecoosac
          - geo2txt
          - geoview
          - hysteria
          - ipt2socks
          - luci-app-axonhub
          - luci-app-eqosplus
          - luci-app-gecoosac
          - luci-app-homeproxy
          - luci-app-mosdns
          - luci-app-nikki
          - luci-app-passwall
          - luci-app-passwall2
          - luci-app-wolultra
          - luci-theme-material3
          - microsocks
          - mihomo-meta
          - mosdns
          - naiveproxy
          - nikki
          - shadow-tls
          - shadowsocks-rust
          - shadowsocksr-libev
          - simple-obfs
          - sing-box
          - smartdns
          - tcping
          - v2ray-geodata
          - v2ray-plugin
          - xray-core
          - xray-plugin

      preset:
        description: "plugin=all 时按组编译"
        type: choice
        default: all
        options:
          - all
          - luci-app
          - proxy-core
          - passwall
          - nikki
          - mosdns
          - theme
          - custom

      packages:
        description: "plugin=all 且 preset=custom 时使用：包名，空格或逗号分隔"
        type: string
        default: ""

      exclude:
        description: "默认不编译的包（空格/逗号分隔）。在 plugin 下拉里点名、或 custom 里写包名时不受此限"
        type: string
        default: "axonhub luci-app-axonhub shadow-tls shadowsocks-rust"

      upload_all:
        description: "上传全部产物（含 -dbg / -dev），否则只上传主包"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    # 所有输入只在这里出现一次，后续步骤一律用 $PLATFORM / $OWT_VER … 引用
    env:
      PLATFORM: ${{ inputs.platform }}
      OWT_VER: ${{ inputs.openwrt_version }}
      PLUGIN: ${{ inputs.plugin }}
      PRESET: ${{ inputs.preset }}
      CUSTOM_PKGS: ${{ inputs.packages }}
      EXCLUDE_PKGS: ${{ inputs.exclude }}
      UPLOAD_ALL: ${{ inputs.upload_all }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 先解析包列表：错了就立刻失败，别浪费十分钟下 SDK ----
      - name: Resolve package list
        run: |
          set -euo pipefail
          # 仓库根目录下所有含 Makefile 的目录 = 可编译的包
          ALL=$(find . -maxdepth 2 -name Makefile -not -path './.git/*' \
                | sed 's|^\./||; s|/Makefile$||' | sort | tr '\n' ' ')
          echo "仓库内全部包: $ALL"

          # ---- 先定 LIST ----
          # 显式点名（下拉选中单个包 / custom 里写包名）→ 不受 exclude 影响
          # 批量（plugin=all 且 preset≠custom）→ 再减去 exclude
          SKIP_EXCLUDE="no"
          if [ "${PLUGIN:-all}" != "all" ]; then
            LIST="$PLUGIN"
            SKIP_EXCLUDE="yes"
            echo "→ 下拉选中单个插件: $PLUGIN（不套 exclude）"
          else
            case "${PRESET:-all}" in
              all)
                LIST="$ALL" ;;
              luci-app)
                LIST=$(echo "$ALL" | tr ' ' '\n' | grep -E '^luci-app-' | tr '\n' ' ') ;;
              theme)
                LIST=$(echo "$ALL" | tr ' ' '\n' | grep -E '^luci-theme-' | tr '\n' ' ') ;;
              proxy-core)
                LIST="xray-core xray-plugin v2ray-plugin sing-box hysteria shadowsocks-rust \
                      shadow-tls naiveproxy chinadns-ng geoview microsocks tcping simple-obfs \
                      mihomo-meta mosdns geo2txt" ;;
              passwall)
                LIST="luci-app-passwall xray-core xray-plugin v2ray-plugin sing-box hysteria \
                      shadowsocks-rust shadow-tls shadowsocksr-libev naiveproxy chinadns-ng \
                      dns2socks geoview microsocks tcping simple-obfs ipt2socks v2ray-geodata \
                      smartdns" ;;
              nikki)
                LIST="luci-app-nikki nikki mihomo-meta" ;;
              mosdns)
                LIST="luci-app-mosdns mosdns geo2txt" ;;
              custom)
                LIST=$(echo "${CUSTOM_PKGS:-}" | tr ',' ' ')
                SKIP_EXCLUDE="yes"
                echo "→ custom 显式点名（不套 exclude）" ;;
              *)
                echo "::error::未知 preset: $PRESET"; exit 1 ;;
            esac
          fi

          # ---- 减去默认不编译的包（只对批量 preset 生效）----
          if [ "$SKIP_EXCLUDE" = "no" ] && [ -n "${EXCLUDE_PKGS:-}" ]; then
            EX=$(echo "$EXCLUDE_PKGS" | tr ',' ' ')
            echo "→ 默认不编译: $EX"
            for e in $EX; do
              NL=""
              for p in $LIST; do
                if [ "$p" != "$e" ]; then NL="$NL $p"; fi
              done
              LIST="$NL"
            done
          fi

          # ---- 去重 + 校验存在 ----
          RES=""
          for p in $LIST; do
            if [ ! -d "$p" ] || [ ! -f "$p/Makefile" ]; then
              echo "::warning::跳过不存在的包: $p"
              continue
            fi
            case " $RES " in *" $p "*) continue ;; esac
            RES="$RES $p"
          done
          RES=$(echo "$RES" | xargs)

          if [ -z "$RES" ]; then
            echo "::error::解析出的包列表为空（plugin=${PLUGIN:-all} preset=${PRESET:-all} exclude=${EXCLUDE_PKGS:-无}）"
            exit 1
          fi

          echo "→ 将编译: $RES"
          echo "$RES" > pkglist.txt
          cat pkglist.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev \
            python3 python3-setuptools python3-pyelftools \
            rsync unzip zlib1g-dev file wget zstd curl jq

      - name: Resolve SDK
        run: |
          set -euo pipefail
          TARGET="${PLATFORM%%/*}"
          SUBTARGET="${PLATFORM##*/}"

          if [ "$OWT_VER" = "snapshot" ]; then
            BASE="https://downloads.openwrt.org/snapshots/targets/${TARGET}/${SUBTARGET}"
          else
            BASE="https://downloads.openwrt.org/releases/${OWT_VER}/targets/${TARGET}/${SUBTARGET}"
          fi

          echo "→ 目录: $BASE"
          # SDK 文件名里带 GCC 版本（gcc-14.3.0_musl…），不能硬编码，从目录列表解析
          SDK_FILE=$(curl -sL --fail --retry 3 "$BASE/" \
            | grep -oE 'openwrt-sdk-[^"<]+\.Linux-x86_64\.tar\.(zst|xz)' \
            | sort -u | head -1)

          if [ -z "$SDK_FILE" ]; then
            echo "::error::在 $BASE 下没找到 OpenWrt SDK"
            echo "—— 可能原因 ——"
            echo "1) 平台 target/subtarget 名字不对或该版本没有预编译 SDK"
            echo "   （旧名 ipq807x 已并入 qualcommax，需用 qualcommax/ipq807x）"
            echo "2) openwrt_version 填错（25.12.6 / 24.10.5 / snapshot）"
            echo "—— 该目录实际存在的 SDK ——"
            curl -sL "$BASE/" | grep -oE 'openwrt-sdk-[^"<]+' | sort -u | head -20 || true
            exit 1
          fi

          echo "→ SDK:   $SDK_FILE"
          # 写成 env 文件供后续步骤 source，避免反复插值
          {
            echo "SDK_URL=${BASE}/${SDK_FILE}"
            echo "SDK_FILE=${SDK_FILE}"
            echo "TARGET=${TARGET}"
            echo "SUBTARGET=${SUBTARGET}"
            echo "TAG=${OWT_VER}-${TARGET}-${SUBTARGET}"
          } > sdk.env
          cat sdk.env

      - name: Download & extract SDK
        run: |
          set -euo pipefail
          . ./sdk.env
          echo "→ 下载 $SDK_URL"
          curl -sL --fail --retry 3 --connect-timeout 30 -o sdk-archive "$SDK_URL"
          ls -lh sdk-archive
          mkdir -p sdk
          case "$SDK_FILE" in
            *.tar.zst) tar --zstd -xf sdk-archive -C sdk --strip-components=1 ;;
            *.tar.xz)  tar -xJf sdk-archive -C sdk --strip-components=1 ;;
            *) echo "::error::未知 SDK 归档格式: $SDK_FILE"; exit 1 ;;
          esac
          ls sdk | head

      - name: Update feeds
        run: |
          set -euo pipefail
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject packages into SDK
        run: |
          set -euo pipefail
          cd sdk
          for p in $(cat ../pkglist.txt); do
            # 同名 feed 包会让 make 报 "redefining package"，
            # 注意 feed 包是**符号链接**，不能用 -type d 过滤（否则删不掉）
            find package/feeds -name "$p" -exec rm -rf {} + 2>/dev/null || true
            rm -rf "package/$p"
            cp -a "../$p" "package/$p"
            echo "→ package/$p"
          done
          echo "→ package/ 下已注入:"
          find package -maxdepth 1 -mindepth 1 -type d | sort

      - name: Build
        run: |
          set -uo pipefail
          cd sdk

          if ! make defconfig; then
            echo "::error::make defconfig 失败"
            exit 1
          fi

          mkdir -p ../build-logs
          : > ../build-result.txt

          for p in $(cat ../pkglist.txt); do
            echo "=============================================================="
            echo "▶ 编译 $p"
            echo "=============================================================="

            LOG="../build-logs/$p.log"
            TGT="$p"

            # make 的 target 用的是 build target 名，通常是目录名；
            # 但少数包 PK_NAME 与目录不一致（如 xray-core 目录 vs PKG_NAME=Xray-core），
            # 拿到 "No rule to make target" 时改用 PKG_NAME 重试。
            if make "package/$TGT/compile" -j"$(nproc)" V=s > "$LOG" 2>&1; then
              echo "✅ $p"
              echo "ok   $p" >> ../build-result.txt
              continue
            fi

            PKGNAME=$(sed -nE 's/^[[:space:]]*PKG_NAME[[:space:]]*[:?+]?=[[:space:]]*//p' \
                        "package/$p/Makefile" | head -1)
            # 派生式（如 luci-app-eqosplus 的 PKG_NAME:=luci-app-$(THEME_NAME)）
            # 含 $ 不能当 make target，直接放弃回退
            case "$PKGNAME" in *'$'*) PKGNAME='' ;; esac

            if [ -n "$PKGNAME" ] && [ "$PKGNAME" != "$p" ] \
               && grep -q 'No rule to make target' "$LOG"; then
              echo " ↳ 目录名没命中，改用 PKG_NAME=$PKGNAME 重试"
              TGT="$PKGNAME"
              if make "package/$TGT/compile" -j"$(nproc)" V=s >> "$LOG" 2>&1; then
                echo "✅ $p (as $PKGNAME)"
                echo "ok   $p" >> ../build-result.txt
                continue
              fi
            fi

            echo "❌ $p  （末尾日志如下）"
            tail -40 "$LOG" || true
            echo "fail $p" >> ../build-result.txt
          done

          echo "=============================================================="
          echo "结果:"
          cat ../build-result.txt

          # 有失败就让 job 失败（产物与日志仍会因 if:always() 上传）
          if grep -q '^fail ' ../build-result.txt; then
            echo "::error::有包编译失败，详见 build-logs 产物"
            exit 1
          fi

      - name: Collect artifacts
        if: always()
        run: |
          set -uo pipefail
          # 前面步骤失败时 sdk.env 可能不存在，优雅降级
          if [ -f ./sdk.env ]; then . ./sdk.env; else TAG="unknown"; fi

          OUT="artifacts/${TAG}"
          mkdir -p "$OUT"

          # OpenWrt 25.x 用 .apk，24.x 及以前用 .ipk，两种都收
          if [ "$UPLOAD_ALL" = "true" ]; then
            find sdk/bin -type f \( -name '*.ipk' -o -name '*.apk' \) \
                 -exec cp -a {} "$OUT/" \; 2>/dev/null || true
          else
            find sdk/bin -type f \( -name '*.ipk' -o -name '*.apk' \) \
                 ! -name '*-dbg.*' ! -name '*-dev.*' ! -name '*-src.*' \
                 -exec cp -a {} "$OUT/" \; 2>/dev/null || true
          fi

          echo "→ 产物:"
          ls -lh "$OUT" | head -60 || true
          COUNT=$(find "$OUT" -type f | wc -l)
          echo "→ 共 $COUNT 个包"
          [ "$COUNT" -gt 0 ] || echo "::warning::没有收集到任何产物"

      - name: Summary
        if: always()
        run: |
          {
            echo "## 编译结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 平台 | \`$PLATFORM\` |"
            echo "| OpenWrt | \`$OWT_VER\` |"
            echo "| preset | \`$PRESET\` |"
            echo ""
            echo "### 各包结果"
            echo '```'
            cat build-result.txt 2>/dev/null || echo "(无)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 7
