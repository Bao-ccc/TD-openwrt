name: Build Packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "目标平台（默认 X86_64）"
        type: choice
        default: x86/64
        options:
          - x86/64
          - x86/generic
          - armsr/armv8
          - armsr/armv7
          - rockchip/armv8
          - bcm27xx/bcm2711
          - bcm27xx/bcm2710
          - mediatek/filogic
          - ramips/mt7621
          - ramips/mt76x8
          - ath79/generic
          - ipq807x/generic
          - sunxi/cortexa8

      openwrt_version:
        description: "OpenWrt 版本（如 25.12.6 / 24.10.5 / snapshot）"
        type: string
        default: "25.12.6"

      preset:
        description: "要编译哪些插件"
        type: choice
        default: all
        options:
          - all
          - luci-app
          - proxy-core
          - passwall
          - nikki
          - theme
          - custom

      packages:
        description: "preset=custom 时使用：包名，空格或逗号分隔"
        type: string
        default: ""

      upload_all:
        description: "上传全部产物（含 -dbg / -dev），否则只上传主包"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    # 所有输入只在这里出现一次，后续步骤一律用 $PLATFORM / $OWT_VER … 引用
    env:
      PLATFORM: ${{ inputs.platform }}
      OWT_VER: ${{ inputs.openwrt_version }}
      PRESET: ${{ inputs.preset }}
      CUSTOM_PKGS: ${{ inputs.packages }}
      UPLOAD_ALL: ${{ inputs.upload_all }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev \
            file wget zstd curl jq

      - name: Resolve SDK
        run: |
          set -euo pipefail
          TARGET="${PLATFORM%%/*}"
          SUBTARGET="${PLATFORM##*/}"

          if [ "$OWT_VER" = "snapshot" ]; then
            BASE="https://downloads.openwrt.org/snapshots/targets/${TARGET}/${SUBTARGET}"
          else
            BASE="https://downloads.openwrt.org/releases/${OWT_VER}/targets/${TARGET}/${SUBTARGET}"
          fi

          echo "→ 目录: $BASE"
          # SDK 文件名里带 GCC 版本（gcc-14.3.0_musl…），不能硬编码，从目录列表解析
          SDK_FILE=$(curl -sL --fail --retry 3 "$BASE/" \
            | grep -oE 'openwrt-sdk-[^"<]+\.Linux-x86_64\.tar\.(zst|xz)' \
            | sort -u | head -1)

          if [ -z "$SDK_FILE" ]; then
            echo "::error::在 $BASE 下没找到 OpenWrt SDK，请检查平台 / 版本是否正确"
            exit 1
          fi

          echo "→ SDK:   $SDK_FILE"
          # 写成 env 文件供后续步骤 source，避免反复插值
          {
            echo "SDK_URL=${BASE}/${SDK_FILE}"
            echo "SDK_FILE=${SDK_FILE}"
            echo "TARGET=${TARGET}"
            echo "SUBTARGET=${SUBTARGET}"
            echo "TAG=${OWT_VER}-${TARGET}-${SUBTARGET}"
          } > sdk.env
          cat sdk.env

      - name: Download & extract SDK
        run: |
          set -euo pipefail
          . ./sdk.env
          echo "→ 下载 $SDK_URL"
          curl -sL --fail --retry 3 --connect-timeout 30 -o sdk-archive "$SDK_URL"
          ls -lh sdk-archive
          mkdir -p sdk
          case "$SDK_FILE" in
            *.tar.zst) tar --zstd -xf sdk-archive -C sdk --strip-components=1 ;;
            *.tar.xz)  tar -xJf sdk-archive -C sdk --strip-components=1 ;;
            *) echo "::error::未知 SDK 归档格式: $SDK_FILE"; exit 1 ;;
          esac
          ls sdk | head

      - name: Update feeds
        run: |
          set -euo pipefail
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Resolve package list
        run: |
          set -euo pipefail
          # 仓库根目录下所有含 Makefile 的目录 = 可编译的包
          ALL=$(find . -maxdepth 2 -name Makefile \
                  -not -path './sdk/*' -not -path './.git/*' \
                | sed 's|^\./||; s|/Makefile$||' | sort | tr '\n' ' ')
          echo "仓库内全部包: $ALL"

          case "$PRESET" in
            all)
              LIST="$ALL" ;;
            luci-app)
              LIST=$(echo "$ALL" | tr ' ' '\n' | grep -E '^luci-app-' | tr '\n' ' ') ;;
            proxy-core)
              LIST="xray-core xray-plugin v2ray-plugin sing-box hysteria shadowsocks-rust \
                    shadow-tls naiveproxy chinadns-ng geoview microsocks tcping simple-obfs \
                    mihomo-meta mihomo-alpha" ;;
            passwall)
              LIST="luci-app-passwall xray-core xray-plugin v2ray-plugin sing-box hysteria \
                    shadowsocks-rust shadow-tls shadowsocksr-libev naiveproxy chinadns-ng \
                    dns2socks geoview microsocks tcping simple-obfs ipt2socks v2ray-geodata \
                    smartdns" ;;
            nikki)
              LIST="luci-app-nikki nikki mihomo-meta mihomo-alpha" ;;
            theme)
              LIST=$(echo "$ALL" | tr ' ' '\n' | grep -E '^luci-theme-' | tr '\n' ' ') ;;
            custom)
              LIST=$(echo "$CUSTOM_PKGS" | tr ',' ' ') ;;
            *)
              echo "::error::未知 preset: $PRESET"; exit 1 ;;
          esac

          # 去重 + 校验存在
          RES=""
          for p in $LIST; do
            if [ ! -d "$p" ] || [ ! -f "$p/Makefile" ]; then
              echo "::warning::跳过不存在的包: $p"
              continue
            fi
            case " $RES " in *" $p "*) continue ;; esac
            RES="$RES $p"
          done
          RES=$(echo "$RES" | xargs)

          if [ -z "$RES" ]; then
            echo "::error::解析出的包列表为空（preset=$PRESET）"
            exit 1
          fi

          echo "→ 将编译: $RES"
          echo "$RES" > pkglist.txt
          cat pkglist.txt

      - name: Inject packages into SDK
        run: |
          set -euo pipefail
          cd sdk
          for p in $(cat ../pkglist.txt); do
            # 同名 feed 包会让 make 报重复定义，先让我们的版本赢
            find package/feeds -maxdepth 2 -type d -name "$p" \
                 -exec rm -rf {} + 2>/dev/null || true
            rm -rf "package/$p"
            cp -a "../$p" "package/$p"
            echo "→ package/$p"
          done

      - name: Build
        run: |
          set -uo pipefail
          cd sdk
          make defconfig

          mkdir -p ../build-logs
          : > ../build-result.txt
          for p in $(cat ../pkglist.txt); do
            echo "=============================================================="
            echo "▶ 编译 $p"
            echo "=============================================================="
            if make "package/$p/compile" -j"$(nproc)" V=s \
                 > "../build-logs/$p.log" 2>&1; then
              echo "✅ $p"
              echo "ok   $p" >> ../build-result.txt
            else
              echo "❌ $p  （末尾日志如下）"
              tail -40 "../build-logs/$p.log" || true
              echo "fail $p" >> ../build-result.txt
            fi
          done

          echo "=============================================================="
          echo "结果:"
          cat ../build-result.txt

          # 有失败就让 job 失败（产物与日志仍会因 if:always() 上传）
          if grep -q '^fail ' ../build-result.txt; then
            echo "::error::有包编译失败，详见 build-logs 产物"
            exit 1
          fi

      - name: Collect artifacts
        if: always()
        run: |
          set -euo pipefail
          . ./sdk.env
          OUT="artifacts/${TAG}"
          mkdir -p "$OUT"

          # OpenWrt 25.x 用 .apk，24.x 及以前用 .ipk，两种都收
          if [ "$UPLOAD_ALL" = "true" ]; then
            find sdk/bin -type f \( -name '*.ipk' -o -name '*.apk' \) \
                 -exec cp -a {} "$OUT/" \;
          else
            find sdk/bin -type f \( -name '*.ipk' -o -name '*.apk' \) \
                 ! -name '*-dbg.*' ! -name '*-dev.*' ! -name '*-src.*' \
                 -exec cp -a {} "$OUT/" \;
          fi

          echo "→ 产物:"
          ls -lh "$OUT" | head -60 || true
          COUNT=$(find "$OUT" -type f | wc -l)
          echo "→ 共 $COUNT 个包"
          [ "$COUNT" -gt 0 ] || echo "::warning::没有收集到任何产物"

      - name: Summary
        if: always()
        run: |
          . ./sdk.env 2>/dev/null || true
          {
            echo "## 编译结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 平台 | \`$PLATFORM\` |"
            echo "| OpenWrt | \`$OWT_VER\` |"
            echo "| preset | \`$PRESET\` |"
            echo ""
            echo "### 各包结果"
            echo '```'
            cat build-result.txt 2>/dev/null || echo "(无)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 7
