# =============================================================================
# OpenWrt 插件/包编译工作流
# 默认：x86/64 + 最新 snapshot SDK（来自 openwrt/openwrt master）
# =============================================================================
name: Build Packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "目标平台（默认 x86/64）"
        type: choice
        default: x86/64
        options:
          - x86/64
          - x86/generic
          - armsr/armv8
          - armsr/armv7
          - rockchip/armv8
          - bcm27xx/bcm2711
          - bcm27xx/bcm2710
          - mediatek/filogic
          - ramips/mt7621
          - ramips/mt76x8
          - ath79/generic
          - ipq807x/generic
          - sunxi/cortexa8
      openwrt_version:
        description: "OpenWrt 版本（默认 snapshot = 最新，也可填 24.10.5 / 25.12.6 等）"
        type: string
        default: "snapshot"
      preset:
        description: "要编译哪些插件"
        type: choice
        default: all
        options:
          - all
          - luci-app
          - proxy-core
          - passwall
          - nikki
          - theme
          - custom
      packages:
        description: "preset=custom 时使用：包名，空格或逗号分隔"
        type: string
        default: ""
      upload_all:
        description: "上传全部产物（含 -dbg / -dev / -src），否则只上传主包"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PLATFORM: ${{ inputs.platform }}
      OWT_VER: ${{ inputs.openwrt_version }}
      PRESET: ${{ inputs.preset }}
      CUSTOM_PKGS: ${{ inputs.packages }}
      UPLOAD_ALL: ${{ inputs.upload_all }}

    steps:
      # ----------------------------------------------------------------------
      # 1. 检出仓库
      # ----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # 2. 安装编译依赖
      # ----------------------------------------------------------------------
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 rsync unzip \
            zlib1g-dev file wget zstd curl jq

      # ----------------------------------------------------------------------
      # 3. 解析目标平台并获取最新 SDK 地址
      #    snapshot 对应 https://github.com/openwrt/openwrt master 分支
      # ----------------------------------------------------------------------
      - name: Resolve SDK
        run: |
          set -euo pipefail

          TARGET="${PLATFORM%%/*}"
          SUBTARGET="${PLATFORM##*/}"

          if [ "$OWT_VER" = "snapshot" ]; then
            # 最新 master 分支 SDK
            BASE="https://downloads.openwrt.org/snapshots/targets/${TARGET}/${SUBTARGET}"
          else
            BASE="https://downloads.openwrt.org/releases/${OWT_VER}/targets/${TARGET}/${SUBTARGET}"
          fi

          echo "→ 目标目录: $BASE"

          # SDK 文件名包含 GCC 版本，必须从目录列表动态解析
          SDK_FILE=$(curl -sL --fail --retry 3 "$BASE/" \
            | grep -oE 'openwrt-sdk-[^"<]+\.Linux-x86_64\.tar\.(zst|xz)' \
            | sort -u \
            | head -1)

          if [ -z "$SDK_FILE" ]; then
            echo "::error::在 $BASE 下未找到 OpenWrt SDK，请检查平台或版本是否正确"
            exit 1
          fi

          echo "→ SDK 文件: $SDK_FILE"

          {
            echo "SDK_URL=${BASE}/${SDK_FILE}"
            echo "SDK_FILE=${SDK_FILE}"
            echo "TARGET=${TARGET}"
            echo "SUBTARGET=${SUBTARGET}"
            echo "TAG=${OWT_VER}-${TARGET}-${SUBTARGET}"
          } > sdk.env

          cat sdk.env

      # ----------------------------------------------------------------------
      # 4. 下载并解压 SDK
      # ----------------------------------------------------------------------
      - name: Download & extract SDK
        run: |
          set -euo pipefail
          . ./sdk.env

          echo "→ 下载 $SDK_URL"
          curl -sL --fail --retry 3 --connect-timeout 30 -o sdk-archive "$SDK_URL"
          ls -lh sdk-archive

          mkdir -p sdk
          case "$SDK_FILE" in
            *.tar.zst) tar --zstd -xf sdk-archive -C sdk --strip-components=1 ;;
            *.tar.xz)  tar -xJf sdk-archive -C sdk --strip-components=1 ;;
            *)
              echo "::error::未知 SDK 归档格式: $SDK_FILE"
              exit 1
              ;;
          esac

          echo "→ SDK 根目录:"
          ls sdk | head -20

      # ----------------------------------------------------------------------
      # 5. 更新 feeds，并使用最新 golang
      # ----------------------------------------------------------------------
      - name: Update feeds
        run: |
          set -euo pipefail
          cd sdk

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          #echo "→ 替换 golang 为 packages 仓库最新版本"
          #rm -rf feeds/packages/lang/golang
          #git clone --depth 1 https://github.com/openwrt/packages.git /tmp/owrt-packages
          #cp -a /tmp/owrt-packages/lang/golang feeds/packages/lang/golang
          #rm -rf /tmp/owrt-packages

          #./scripts/feeds update -a
          #./scripts/feeds install -a

          echo "→ 当前 golang 版本信息:"
          grep -E 'GO_DEFAULT_VERSION|GO_VERSION_MAJOR_MINOR|GO_VERSION_PATCH' \
            feeds/packages/lang/golang/golang-values.mk \
            feeds/packages/lang/golang/golang1.27/Makefile 2>/dev/null || true

      # ----------------------------------------------------------------------
      # 6. 根据 preset 解析最终编译包列表
      # ----------------------------------------------------------------------
      - name: Resolve package list
        run: |
          set -euo pipefail

          ALL=$(find . -maxdepth 2 -name Makefile \
                  -not -path './sdk/*' -not -path './.git/*' \
                | sed 's|^\./||; s|/Makefile$||' \
                | sort \
                | tr '\n' ' ')

          echo "仓库内全部包: $ALL"

          case "$PRESET" in
            all)
              LIST="$ALL"
              ;;
            luci-app)
              LIST=$(echo "$ALL" | tr ' ' '\n' | grep -E '^luci-app-' | tr '\n' ' ')
              ;;
            proxy-core)
              LIST="xray-core xray-plugin v2ray-plugin sing-box hysteria shadowsocks-rust \
                    shadow-tls naiveproxy chinadns-ng geoview microsocks tcping simple-obfs \
                    mihomo-meta"
              ;;
            passwall)
              LIST="luci-app-passwall xray-core xray-plugin v2ray-plugin sing-box hysteria \
                    shadowsocks-rust shadow-tls shadowsocksr-libev naiveproxy chinadns-ng \
                    dns2socks geoview microsocks tcping simple-obfs ipt2socks v2ray-geodata \
                    smartdns"
              ;;
            nikki)
              LIST="luci-app-nikki nikki mihomo-meta"
              ;;
            theme)
              LIST=$(echo "$ALL" | tr ' ' '\n' | grep -E '^luci-theme-' | tr '\n' ' ')
              ;;
            custom)
              LIST=$(echo "$CUSTOM_PKGS" | tr ',' ' ')
              ;;
            *)
              echo "::error::未知 preset: $PRESET"
              exit 1
              ;;
          esac

          # 去重 + 校验包是否存在
          RES=""
          for p in $LIST; do
            [ -z "$p" ] && continue
            if [ ! -d "$p" ] || [ ! -f "$p/Makefile" ]; then
              echo "::warning::跳过不存在的包: $p"
              continue
            fi
            case " $RES " in
              *" $p "*) continue ;;
            esac
            RES="$RES $p"
          done

          RES=$(echo "$RES" | xargs)

          if [ -z "$RES" ]; then
            echo "::error::解析出的包列表为空（preset=$PRESET）"
            exit 1
          fi

          echo "→ 将编译: $RES"
          echo "$RES" > pkglist.txt
          cat pkglist.txt

      # ----------------------------------------------------------------------
      # 7. 注入本地包到 SDK（覆盖同名 feed 包）
      # ----------------------------------------------------------------------
      - name: Inject packages into SDK
        run: |
          set -euo pipefail
          cd sdk

          for p in $(cat ../pkglist.txt); do
            find package/feeds -maxdepth 2 -type d -name "$p" \
                 -exec rm -rf {} + 2>/dev/null || true
            rm -rf "package/$p"
            cp -a "../$p" "package/$p"
            echo "→ 已注入 package/$p"
          done

      # ----------------------------------------------------------------------
      # 8. 逐包编译
      # ----------------------------------------------------------------------
      - name: Build
        run: |
          set -euo pipefail
          cd sdk

          make defconfig
          mkdir -p ../build-logs
          : > ../build-result.txt

          for p in $(cat ../pkglist.txt); do
            echo "=============================================================="
            echo "▶ 编译 $p"
            echo "=============================================================="

            if make "package/$p/compile" -j"$(nproc)" V=s \
                 > "../build-logs/$p.log" 2>&1; then
              echo "✅ $p"
              echo "ok   $p" >> ../build-result.txt
            else
              echo "❌ $p  （末尾日志如下）"
              tail -40 "../build-logs/$p.log" || true
              echo "fail $p" >> ../build-result.txt
            fi
          done

          echo "=============================================================="
          echo "编译结果汇总:"
          cat ../build-result.txt

          if grep -q '^fail ' ../build-result.txt; then
            echo "::error::存在编译失败的包，请查看 build-logs 产物"
            exit 1
          fi

      # ----------------------------------------------------------------------
      # 9. 收集产物（兼容 .ipk 与 .apk）
      # ----------------------------------------------------------------------
      - name: Collect artifacts
        if: always()
        run: |
          set -euo pipefail
          . ./sdk.env

          OUT="artifacts/${TAG}"
          mkdir -p "$OUT"

          if [ "$UPLOAD_ALL" = "true" ]; then
            find sdk/bin -type f \( -name '*.ipk' -o -name '*.apk' \) \
                 -exec cp -a {} "$OUT/" \;
          else
            find sdk/bin -type f \( -name '*.ipk' -o -name '*.apk' \) \
                 ! -name '*-dbg.*' ! -name '*-dev.*' ! -name '*-src.*' \
                 -exec cp -a {} "$OUT/" \;
          fi

          echo "→ 产物列表:"
          ls -lh "$OUT" | head -60 || true

          COUNT=$(find "$OUT" -type f | wc -l)
          echo "→ 共收集 $COUNT 个包"

          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::没有收集到任何产物"
          fi

      # ----------------------------------------------------------------------
      # 10. 写入 Job Summary
      # ----------------------------------------------------------------------
      - name: Summary
        if: always()
        run: |
          . ./sdk.env 2>/dev/null || true

          {
            echo "## 编译结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 平台 | \`$PLATFORM\` |"
            echo "| OpenWrt | \`$OWT_VER\` |"
            echo "| preset | \`$PRESET\` |"
            echo ""
            echo "### 各包结果"
            echo '```'
            cat build-result.txt 2>/dev/null || echo "(无)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ----------------------------------------------------------------------
      # 11. 上传编译产物
      # ----------------------------------------------------------------------
      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      # ----------------------------------------------------------------------
      # 12. 上传编译日志
      # ----------------------------------------------------------------------
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 7